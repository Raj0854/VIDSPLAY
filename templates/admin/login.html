<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Sign In — VIDSPLAY Dashboard</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='img/logo.png') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/modern.css') }}">
    <style>
        body {
            background: radial-gradient(circle at top right, rgba(79, 172, 254, 0.15), transparent 50%),
                        radial-gradient(circle at bottom left, rgba(168, 85, 247, 0.15), transparent 50%),
                        #0a0e17;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }
        .login-card {
            background: rgba(17, 24, 39, 0.85);
            backdrop-filter: blur(20px);
            border: 1px solid var(--vp-border);
            border-radius: var(--vp-radius-lg);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
            width: 100%;
            max-width: 420px;
            padding: 2.5rem 2rem;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="text-center mb-4">
            <a href="{{ url_for('views.index') }}" class="d-inline-flex align-items-center gap-2 text-decoration-none mb-3">
                <img src="{{ url_for('static', filename='img/logo.png') }}" alt="VIDSPLAY" width="38" height="38">
                <span class="fs-3 fw-bold text-white">VIDS<span class="vp-brand-highlight">PLAY</span></span>
            </a>
            <h5 class="fw-semibold text-white mb-1">Admin Portal</h5>
            <p class="text-secondary small">Enter your administrator credentials to continue</p>
        </div>

        <div id="loginAlert" class="alert alert-danger py-2 px-3 small d-none" role="alert"></div>

        <form id="adminLoginForm">
            <div class="mb-3">
                <label for="usernameInput" class="form-label text-secondary small fw-semibold">Username or Email</label>
                <div class="input-group">
                    <span class="input-group-text bg-dark border-secondary text-secondary"><i class="bi bi-person"></i></span>
                    <input type="text" class="form-control bg-dark border-secondary text-white" id="usernameInput" placeholder="admin" required autofocus>
                </div>
            </div>

            <div class="mb-3">
                <label for="passwordInput" class="form-label text-secondary small fw-semibold">Password</label>
                <div class="input-group">
                    <span class="input-group-text bg-dark border-secondary text-secondary"><i class="bi bi-key"></i></span>
                    <input type="password" class="form-control bg-dark border-secondary text-white" id="passwordInput" placeholder="••••••••" required>
                </div>
            </div>

            <div class="d-flex justify-content-between align-items-center mb-4">
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="rememberMe">
                    <label class="form-check-label text-secondary small" for="rememberMe">Remember me</label>
                </div>
                <a href="{{ url_for('views.index') }}" class="small text-info text-decoration-none">Back to Website</a>
            </div>

            <button type="submit" class="btn vp-btn-primary w-100 justify-content-center py-2" id="loginSubmitBtn">
                <span id="btnSpinner" class="spinner-border spinner-border-sm me-2 d-none" role="status"></span>
                <span>Sign In to Dashboard</span>
            </button>
        </form>

        <div class="mt-4 pt-3 border-top border-secondary text-center text-secondary" style="font-size: 0.78rem;">
            Default development admin: <code>admin</code> / <code>admin123</code>
        </div>
    </div>

    <script>
        document.getElementById('adminLoginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const alertBox = document.getElementById('loginAlert');
            const submitBtn = document.getElementById('loginSubmitBtn');
            const spinner = document.getElementById('btnSpinner');

            alertBox.classList.add('d-none');
            submitBtn.disabled = true;
            spinner.classList.remove('d-none');

            const username = document.getElementById('usernameInput').value.trim();
            const password = document.getElementById('passwordInput').value;
            const remember = document.getElementById('rememberMe').checked;

            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password, remember })
                });
                const data = await res.json();

                if (!res.ok || !data.success) {
                    alertBox.textContent = data.error || 'Authentication failed. Please verify credentials.';
                    alertBox.classList.remove('d-none');
                    submitBtn.disabled = false;
                    spinner.classList.add('d-none');
                    return;
                }

                // Redirect to admin dashboard
                window.location.href = '/admin';
            } catch (err) {
                alertBox.textContent = 'Network error while attempting to log in.';
                alertBox.classList.remove('d-none');
                submitBtn.disabled = false;
                spinner.classList.add('d-none');
            }
        });
    </script>
</body>
</html>
