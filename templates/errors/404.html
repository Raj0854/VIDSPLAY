{% extends "base.html" %}

{% block title %}404 — Page Not Found | VIDSPLAY{% endblock %}

{% block content %}
<div class="container py-5 text-center">
    <div class="py-5">
        <h1 class="display-1 fw-bold text-info">404</h1>
        <h3 class="text-white mb-3">Oops! Content Not Found</h3>
        <p class="text-secondary mx-auto mb-4" style="max-width: 500px;">
            The page or video you are looking for might have been moved, unpublished, or does not exist.
        </p>
        <div class="d-flex justify-content-center gap-3">
            <a href="{{ url_for('views.index') }}" class="btn vp-btn-primary">
                <i class="bi bi-house-door-fill"></i> Return to Home
            </a>
            <a href="javascript:history.back()" class="btn vp-btn-glass">
                <i class="bi bi-arrow-left"></i> Go Back
            </a>
        </div>
    </div>
</div>
{% endblock %}
