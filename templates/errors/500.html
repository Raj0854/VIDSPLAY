{% extends "base.html" %}

{% block title %}500 — Server Error | VIDSPLAY{% endblock %}

{% block content %}
<div class="container py-5 text-center">
    <div class="py-5">
        <h1 class="display-1 fw-bold text-danger">500</h1>
        <h3 class="text-white mb-3">Internal Server Error</h3>
        <p class="text-secondary mx-auto mb-4" style="max-width: 500px;">
            An unexpected error occurred while processing your request. Please try again shortly.
        </p>
        <a href="{{ url_for('views.index') }}" class="btn vp-btn-primary">
            <i class="bi bi-house-door-fill"></i> Return to Home
        </a>
    </div>
</div>
{% endblock %}
